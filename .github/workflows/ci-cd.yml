name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # F17: rollback manual de código (nunca de la base de datos, ver job "rollback"
  # más abajo y la sección "Protocolo expand/contract" de DEPLOY.md).
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          SHA del commit al que revertir el código. Vacío = usa el SHA guardado en
          ~/.ultimo-deploy-ok del droplet (el último deploy cuyo smoke test pasó).
        required: false
        type: string

jobs:
  verificar:
    name: Typecheck + build
    # No corre en un workflow_dispatch (ese trigger es solo para el rollback manual).
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Instalar dependencias (backend)
        run: npm ci

      - name: Tests unitarios (backend)
        run: npm test

      - name: Guardrail de migraciones (drift de schema, ángulo 7)
        run: npm run db:check

      - name: Typecheck (backend)
        run: npm run typecheck

      - name: Instalar dependencias (panel)
        run: npm ci --prefix web

      - name: Typecheck (panel)
        run: npm run typecheck --prefix web

      - name: Build del panel
        run: npm run build --prefix web

  e2e-panel:
    name: E2E del panel (Playwright)
    # No corre en un workflow_dispatch (ese trigger es solo para el rollback manual).
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Instalar dependencias (backend, incluye Playwright y tsx)
        run: npm ci

      - name: Build del panel (web/dist — el server E2E lo sirve)
        run: npm run web:build

      - name: Instalar el navegador de Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Correr el E2E del panel (server en memoria + Graph mockeado)
        run: npx playwright test

  desplegar:
    name: Deploy a producción
    needs: [verificar, e2e-panel]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    env:
      DEPLOY_HOST: "157.230.190.60"
      DEPLOY_USER: "sebastian"
      DEPLOY_DIR: "~/lavacar-whatsapp-bot"
      DEPLOY_PM2_APP: "whatsapp-bot"
      BASE_URL: "https://wabotlavacar.selyon.app"
      SALUD_URL: "https://wabotlavacar.selyon.app/salud"
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # F17: antes de tocar nada, anotamos qué SHA está corriendo AHORA en el droplet.
      # Si existe ~/.ultimo-deploy-ok (el último deploy cuyo smoke test pasó) usamos ESE
      # — es más confiable que el HEAD actual, que podría estar en medio de un deploy
      # fallido previo. Si el archivo todavía no existe (primera vez tras agregar esto),
      # caemos al HEAD real del droplet antes del pull. Este valor solo se usa para el
      # mensaje de "cómo revertir" si el deploy de hoy falla más abajo.
      - name: Leer el SHA del último deploy bueno (por si hay que revertir)
        run: |
          prev_sha="$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            if [ -f ~/.ultimo-deploy-ok ]; then
              cat ~/.ultimo-deploy-ok
            else
              cd '"$DEPLOY_DIR"' && git rev-parse HEAD
            fi
          ')"
          echo "PREV_SHA_OK=$prev_sha" >> "$GITHUB_ENV"
          echo "SHA que está corriendo antes de este deploy: $prev_sha"

      # F17: `npm ci` (no `npm install`) instala EXACTAMENTE lo que dice el lockfile
      # (backend y panel) — build reproducible y sin sorpresas de supply chain por un
      # rango de versión que resolvió distinto entre el último `npm run db:check` en CI
      # y lo que termina corriendo en el droplet. `git checkout main` antes del `pull`
      # es defensivo: si un rollback manual (job "rollback") dejó el droplet en detached
      # HEAD sobre un SHA viejo, este paso lo vuelve a dejar sobre la rama antes de tirar
      # de los cambios nuevos — sin esto, `git pull` fallaría con "you are not currently
      # on a branch". El build del panel se hace con `npm ci --prefix web --include=dev`
      # en vez de `npm run web:build` para que también sea reproducible; el `--include=dev`
      # es necesario porque el droplet corre con `NODE_ENV=production`, que por defecto
      # omite las devDependencies (ahí vive `vite`, ver DEPLOY.md § "Si algo falla").
      - name: Actualizar código y reiniciar el bot
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd $DEPLOY_DIR
            git checkout main
            git pull
            npm ci
            npx tsx scripts/migrar.ts
            npx tsx scripts/seedTenants.ts
            npm ci --prefix web --include=dev
            npm run build --prefix web
            pm2 restart $DEPLOY_PM2_APP
          "

      - name: Verificar que el bot responde (/salud)
        run: |
          for i in $(seq 1 10); do
            if curl -sf "$SALUD_URL" > /dev/null; then
              echo "✅ /salud respondió OK (intento $i de 10)"
              exit 0
            fi
            echo "intento $i de 10: /salud no respondió aún, reintento en 3s…"
            sleep 3
          done
          echo "::error::El bot no respondió en /salud tras el deploy (30s de reintentos)"
          exit 1

      # Smoke post-deploy (TESTING.md ángulo 9): más allá de /salud, verifica que las
      # tres superficies críticas están vivas tras el deploy. Ninguna toca datos ni
      # requiere credenciales reales, así que es seguro correrlo contra producción.
      - name: Smoke post-deploy (panel + API + auth)
        run: |
          fallo=0

          # 1) El bundle de React se sirve (no cayó al 503 "corré web:build"). Regresión
          #    típica: falta el build → /panel devuelve 503 y el panel queda inservible.
          panel="$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/panel")"
          cuerpo="$(curl -s "$BASE_URL/panel")"
          if [ "$panel" = "200" ] && printf '%s' "$cuerpo" | grep -qi '<div id="root"'; then
            echo "✅ /panel sirve el bundle de React (200 + #root)"
          else
            echo "::error::/panel no sirvió el bundle (HTTP $panel) — ¿falta web:build?"
            fallo=1
          fi

          # 2) La API del panel está viva y exige auth: /me sin cookie → 401 (no 500/404).
          me="$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/panel/me")"
          if [ "$me" = "401" ]; then
            echo "✅ /api/panel/me sin sesión → 401 (API viva, auth aplicada)"
          else
            echo "::error::/api/panel/me devolvió $me (se esperaba 401)"
            fallo=1
          fi

          # 3) El login está vivo y consulta el tenantStore (base de datos): con Origin del
          #    host y credenciales falsas debe dar 401 — un 500/503 delataría que la base o
          #    el store se rompieron. Es el proxy seguro de "un login real funciona" sin
          #    usar credenciales reales de demo en producción.
          login="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE_URL/api/panel/login" \
            -H "Origin: $BASE_URL" -H 'Content-Type: application/json' \
            -d '{"usuario":"__smoke_inexistente__","password":"__no__"}')"
          if [ "$login" = "401" ]; then
            echo "✅ /api/panel/login con credenciales falsas → 401 (auth + tenantStore vivos)"
          else
            echo "::error::/api/panel/login devolvió $login (se esperaba 401)"
            fallo=1
          fi

          exit $fallo

      # F17: recién si TODO lo de arriba salió bien (esta línea no corre tras un `exit 1`
      # de un paso anterior) marcamos este SHA como el último deploy bueno. El rollback
      # manual (job "rollback") usa este archivo como destino por defecto cuando no se le
      # pasa un SHA explícito — así no depende de que alguien se acuerde cuál era.
      - name: Guardar este SHA como "último deploy bueno"
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "echo '${{ github.sha }}' > ~/.ultimo-deploy-ok"
          echo "Guardado ~/.ultimo-deploy-ok = ${{ github.sha }}"

      # Si CUALQUIER paso anterior de este job falló (git pull, npm ci, la migración, el
      # build, /salud o el smoke), este paso corre igual (if: failure()) y deja bien claro
      # cómo revertir. A propósito NO dispara el rollback solo: revertir código es
      # razonablemente seguro de automatizar, pero si la falla vino de una migración de
      # base de datos, un rollback de código a ciegas puede dejar el código viejo hablando
      # con un esquema nuevo — mejor que lo confirme una persona (ver DEPLOY.md).
      - name: Si el deploy falló, cómo revertir
        if: failure()
        run: |
          echo "::error::El deploy de este push falló. Para revertir el CÓDIGO (no la base de datos) corré manualmente el workflow 'CI/CD' desde la pestaña Actions → 'Run workflow', con SHA=${PREV_SHA_OK:-<no había ninguno guardado, revisar a mano>} (o dejalo vacío para usar el último ~/.ultimo-deploy-ok del droplet). Ver 'Rollback' en DEPLOY.md."

  # F17: rollback MANUAL de código. Se dispara a mano (workflow_dispatch), nunca solo.
  # Revierte `git checkout` + `npm ci` + `pm2 restart` al SHA indicado (o al último
  # guardado en ~/.ultimo-deploy-ok si no se pasa ninguno). A PROPÓSITO no toca
  # migraciones ni el esquema de la base de datos: revertir un esquema es peligroso
  # (puede perder datos escritos con la columna/tabla nueva) y requiere juicio humano,
  # no un job automático. Si la falla fue por una migración, seguí el protocolo
  # expand/contract documentado en DEPLOY.md en vez de correr este job.
  rollback:
    name: Rollback manual de código (NO revierte la base de datos)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    env:
      DEPLOY_HOST: "157.230.190.60"
      DEPLOY_USER: "sebastian"
      DEPLOY_DIR: "~/lavacar-whatsapp-bot"
      DEPLOY_PM2_APP: "whatsapp-bot"
      BASE_URL: "https://wabotlavacar.selyon.app"
      SALUD_URL: "https://wabotlavacar.selyon.app/salud"
    steps:
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Resolver el SHA a revertir
        run: |
          sha_input="${{ github.event.inputs.sha }}"
          if [ -n "$sha_input" ]; then
            resuelto="$sha_input"
          else
            resuelto="$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'cat ~/.ultimo-deploy-ok 2>/dev/null || true')"
            if [ -z "$resuelto" ]; then
              echo "::error::No se pasó un SHA (input 'sha') y no existe ~/.ultimo-deploy-ok en el droplet. No hay a qué revertir — pasá el SHA a mano."
              exit 1
            fi
          fi
          echo "SHA_ROLLBACK=$resuelto" >> "$GITHUB_ENV"
          echo "Se va a revertir el código del droplet al commit: $resuelto"

      - name: Advertencia — este rollback es solo de código
        run: |
          echo "::warning::Este job revierte SOLO el código (git checkout + npm ci + pm2 restart)."
          echo "::warning::NO toca migraciones ni el esquema de la base de datos. Si la falla vino de un cambio de esquema no compatible hacia atrás, este rollback NO alcanza — se necesita juicio humano (protocolo expand/contract en DEPLOY.md)."

      - name: Revertir el código y reiniciar el bot
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd $DEPLOY_DIR
            git fetch --all --tags
            git checkout $SHA_ROLLBACK
            npm ci
            npm ci --prefix web --include=dev
            npm run build --prefix web
            pm2 restart $DEPLOY_PM2_APP
          "

      - name: Verificar que el bot responde (/salud)
        run: |
          for i in $(seq 1 10); do
            if curl -sf "$SALUD_URL" > /dev/null; then
              echo "✅ /salud respondió OK (intento $i de 10)"
              exit 0
            fi
            echo "intento $i de 10: /salud no respondió aún, reintento en 3s…"
            sleep 3
          done
          echo "::error::El bot no respondió en /salud tras el rollback (30s de reintentos)"
          exit 1

      # Mismo smoke que el deploy normal (ver comentario allá arriba) — un rollback de
      # código también puede fallar (por ejemplo, si el SHA elegido es demasiado viejo
      # y ya no es compatible con el esquema actual de la base: otra razón más por la
      # que este job nunca toca migraciones solo).
      - name: Smoke post-rollback (panel + API + auth)
        run: |
          fallo=0

          panel="$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/panel")"
          cuerpo="$(curl -s "$BASE_URL/panel")"
          if [ "$panel" = "200" ] && printf '%s' "$cuerpo" | grep -qi '<div id="root"'; then
            echo "✅ /panel sirve el bundle de React (200 + #root)"
          else
            echo "::error::/panel no sirvió el bundle (HTTP $panel)"
            fallo=1
          fi

          me="$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/panel/me")"
          if [ "$me" = "401" ]; then
            echo "✅ /api/panel/me sin sesión → 401 (API viva, auth aplicada)"
          else
            echo "::error::/api/panel/me devolvió $me (se esperaba 401)"
            fallo=1
          fi

          login="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE_URL/api/panel/login" \
            -H "Origin: $BASE_URL" -H 'Content-Type: application/json' \
            -d '{"usuario":"__smoke_inexistente__","password":"__no__"}')"
          if [ "$login" = "401" ]; then
            echo "✅ /api/panel/login con credenciales falsas → 401 (auth + tenantStore vivos)"
          else
            echo "::error::/api/panel/login devolvió $login (se esperaba 401)"
            fallo=1
          fi

          exit $fallo

      # Solo si el smoke post-rollback pasó: el SHA revertido pasa a ser la realidad del
      # droplet, así que lo dejamos como el nuevo "último bueno" (si se necesitara otro
      # rollback después, o si el deploy normal corre de nuevo, parten de este dato real).
      - name: Marcar el SHA revertido como "último deploy bueno"
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "echo '$SHA_ROLLBACK' > ~/.ultimo-deploy-ok"
          echo "Guardado ~/.ultimo-deploy-ok = $SHA_ROLLBACK"
