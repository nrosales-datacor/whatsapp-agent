name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Rollback manual de código (nunca de la base de datos, ver job "rollback" más abajo y
  # la sección "Protocolo expand/contract" de DEPLOY.md).
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          SHA del commit al que revertir el código. Vacío = usa el SHA guardado en
          ~/.ultimo-deploy-ok del servidor (el último deploy cuyo smoke test pasó).
        required: false
        type: string

jobs:
  verify:
    name: Typecheck + tests + build
    # No corre en un workflow_dispatch (ese trigger es solo para el rollback manual).
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      # Política de dependencias (CLAUDE.md): versiones EXACTAS, sin ^/~. Sin deps, va primero.
      - name: Guardrail de versiones exactas (package.json raíz y web)
        run: npm run ci:versions

      # Toda process.env leída en src/ o scripts/ debe estar en .env.example (o como
      # excepción explícita `# env-check: ignore NOMBRE — motivo`). Sin deps. legacy/ no cuenta.
      - name: Guardrail de .env.example (variables documentadas)
        run: npm run ci:env

      # Ninguna credencial en los archivos versionados: patrones de llaves conocidas (Stripe,
      # Meta, PEM, OpenAI, JWT, URLs de Postgres con clave…) y cadenas prohibidas. La lista de
      # prohibidas NO vive en el repo (sería re-filtrarlas): sale del secret de GitHub
      # CHECK_SECRETS_DENYLIST (una por línea; vacío = solo patrones). Sin deps.
      - name: Guardrail de secretos (scripts/ci/checkSecrets.mjs)
        run: npm run ci:secrets
        env:
          CHECK_SECRETS_DENYLIST: ${{ secrets.CHECK_SECRETS_DENYLIST }}

      # Auditoría de dependencias (scripts/ci/checkAudit.mjs, sin deps; `npm audit` lee los
      # lockfiles, no necesita node_modules). BLOQUEANTE: un aviso alto/crítico de producción
      # (`npm audit --omit=dev`, nivel high) en raíz o web/ que no esté en
      # scripts/ci/auditAllowlist.json, o un ítem de esa allowlist vencido.
      - name: Auditoría de dependencias de producción (raíz y web; altas/críticas fallan)
        run: npm run ci:audit

      # Informativo, nunca falla: `npm audit` completo (con devDependencies) y si cada aviso
      # está evaluado en la allowlist. Es la foto para el repaso mensual (README.md).
      - name: Auditoría completa de dependencias (informativa)
        run: npm run ci:audit:report

      - name: Instalar dependencias (backend)
        run: npm ci

      - name: Typecheck (backend; legacy/ queda fuera del build)
        run: npm run typecheck

      - name: Tests (unit, security, reliability; PGlite en el proceso)
        run: npm test

      - name: Guardrail de migraciones (drift entre los schema.ts y ./drizzle)
        run: npm run db:check

      - name: Instalar dependencias (panel)
        run: npm ci --prefix web

      - name: Typecheck (panel)
        run: npm run typecheck --prefix web

      - name: Build del panel
        run: npm run build --prefix web

  e2e:
    name: Smoke E2E (Playwright)
    # No corre en un workflow_dispatch (ese trigger es solo para el rollback manual).
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Instalar dependencias (backend, incluye Playwright y tsx)
        run: npm ci

      - name: Build del panel (web/dist — el server lo sirve en /panel)
        run: npm run web:build

      - name: Instalar el navegador de Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      # Proyecto "server": smoke del servidor REAL sobre una base efímera en el proceso (PGlite
      # + migraciones + seed de desarrollo, test/e2e/seededServer.ts): /health, router (404
      # JSON), sesión (/auth/me → 401), login falso → 401 y un login de verdad por la UI del
      # panel hasta el Inicio. Proyecto "panel-mock": el panel contra la API simulada.
      - name: Correr el smoke E2E y los E2E del panel
        run: npx playwright test

  deploy:
    name: Deploy a producción
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Gate de aprobación: con el environment "produccion" configurado en GitHub (Settings →
    # Environments → produccion → Required reviewers), el deploy espera a que una persona lo
    # apruebe en la pestaña Actions. El nombre es configuración del repo en GitHub: se
    # conserva tal cual para no perder la regla.
    environment: produccion
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Configurables como variables del repo (Settings → Variables).
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '157.230.190.60' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'sebastian' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/lavacar-whatsapp-bot' }}
      BASE_URL: ${{ vars.BASE_URL || 'https://wabotlavacar.selyon.app' }}
    steps:
      # El panel se compila ACÁ (runner limpio, con devDependencies) y se sube armado: el
      # servidor no instala Vite ni compila en producción.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
      - name: Build del panel (artefacto)
        run: |
          npm ci --prefix web
          npm run build --prefix web
          tar -czf panel.tgz -C web/dist .

      # Llave del host FIJADA (secret DEPLOY_HOST_KEY = línea de known_hosts, ver DEPLOY.md
      # §15): sin ella, ssh-keyscan confía en lo que conteste la IP en ese momento (MITM).
      - name: Configurar SSH
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::Falta el secret DEPLOY_HOST_KEY: se confía en la llave que devuelva el host ahora (ssh-keyscan). Cargalo para fijarla (DEPLOY.md §15)."
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      # Antes de tocar nada, se anota qué SHA está corriendo AHORA en el servidor (el último
      # deploy cuyo smoke pasó, o el HEAD si todavía no hay ninguno). Solo se usa para el
      # mensaje de "cómo revertir" si el deploy de hoy falla más abajo.
      - name: Leer el SHA del último deploy bueno (por si hay que revertir)
        run: |
          prev_sha="$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            if [ -f ~/.ultimo-deploy-ok ]; then
              cat ~/.ultimo-deploy-ok
            else
              cd '"$DEPLOY_DIR"' && git rev-parse HEAD
            fi
          ')"
          echo "PREV_SHA_OK=$prev_sha" >> "$GITHUB_ENV"
          echo "SHA que está corriendo antes de este deploy: $prev_sha"

      # Deploy del commit EXACTO que pasó CI (no lo que haya en main en este momento), con
      # `npm ci --omit=dev` (lockfile, sin devDependencies en producción) y el panel ya
      # compilado por este job. Los scripts .ts corren con `node --import tsx`.
      - name: Subir el panel compilado
        run: scp -i ~/.ssh/deploy_key panel.tgz "$DEPLOY_USER@$DEPLOY_HOST:panel-${{ github.sha }}.tgz"

      - name: Actualizar código y recargar el proceso
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd $DEPLOY_DIR
            before=\$(git rev-parse HEAD)
            git fetch origin
            git checkout -B main ${{ github.sha }}
            npm ci --omit=dev
            # Si este deploy trae migraciones nuevas, backup ANTES de migrar (el rollback de
            # código no revierte el esquema). Si el backup falla, set -e corta el deploy.
            if [ -n \"\$(git diff --name-only \$before HEAD -- drizzle/)\" ]; then
              echo 'Migraciones nuevas: backup previo de la base…'
              node --import tsx scripts/backupDb.ts
            fi
            node --import tsx scripts/migrate.ts
            # Panel: se reemplaza la carpeta entera de una vez (nunca queda a medio copiar).
            rm -rf web/dist.nuevo web/dist.viejo && mkdir -p web/dist.nuevo
            tar -xzf ~/panel-${{ github.sha }}.tgz -C web/dist.nuevo && rm -f ~/panel-${{ github.sha }}.tgz
            if [ -d web/dist ]; then mv web/dist web/dist.viejo; fi
            mv web/dist.nuevo web/dist
            # reload (no restart): PM2 manda SIGINT y el server se apaga ordenado
            # (src/platform/net/shutdown.ts) dentro del kill_timeout de ecosystem.config.cjs.
            pm2 startOrReload ecosystem.config.cjs --update-env
          "

      - name: Verificar que el proceso responde (/health)
        run: |
          for i in $(seq 1 10); do
            if curl -sf "$BASE_URL/health" > /dev/null; then
              echo "✅ /health respondió OK (intento $i de 10)"
              exit 0
            fi
            echo "intento $i de 10: /health no respondió aún, reintento en 3s…"
            sleep 3
          done
          echo "::error::El proceso no respondió en /health tras el deploy (30s de reintentos)"
          exit 1

      # Smoke post-deploy (scripts/ci/smoke.sh, el mismo que corre el rollback): /panel con el
      # bundle, router de la API (404 JSON), /api/panel/auth/me → 401 y un login con un correo
      # de smoke `.invalid` → 401 invalid_credentials (CSRF + validación + base). No usa
      # credenciales reales ni toca datos; el login falso es UN intento por deploy (suma al
      # rate-limit de la IP del runner y queda en logs, aceptado: TESTING.md §9).
      - name: Smoke post-deploy (panel + API + sesión + login)
        run: bash scripts/ci/smoke.sh "$BASE_URL"

      # Recién si TODO lo de arriba salió bien se marca este SHA como el último deploy bueno.
      # El rollback manual usa este archivo como destino por defecto.
      - name: Guardar este SHA como "último deploy bueno"
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "echo '${{ github.sha }}' > ~/.ultimo-deploy-ok"
          echo "Guardado ~/.ultimo-deploy-ok = ${{ github.sha }}"

      # Si CUALQUIER paso anterior falló, este corre igual (if: failure()) y deja claro cómo
      # revertir. A propósito NO dispara el rollback solo: si la falla vino de una migración,
      # un rollback de código a ciegas puede dejar el código viejo con un esquema nuevo.
      - name: Si el deploy falló, cómo revertir
        if: failure()
        run: |
          echo "::error::El deploy de este push falló. Para revertir el CÓDIGO (no la base de datos) corré manualmente el workflow 'CI/CD' desde la pestaña Actions → 'Run workflow', con SHA=${PREV_SHA_OK:-<no había ninguno guardado, revisar a mano>} (o dejalo vacío para usar el último ~/.ultimo-deploy-ok del servidor). Ver 'Rollback' en DEPLOY.md."

  # Rollback MANUAL de código. Se dispara a mano (workflow_dispatch), nunca solo. A
  # PROPÓSITO no toca migraciones ni el esquema: revertir un esquema puede perder datos y
  # requiere juicio humano (protocolo expand/contract en DEPLOY.md).
  rollback:
    name: Rollback manual de código (NO revierte la base de datos)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '157.230.190.60' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'sebastian' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/lavacar-whatsapp-bot' }}
      BASE_URL: ${{ vars.BASE_URL || 'https://wabotlavacar.selyon.app' }}
    steps:
      - name: Configurar SSH
        env:
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::Falta el secret DEPLOY_HOST_KEY: se confía en la llave que devuelva el host ahora (ssh-keyscan). Cargalo para fijarla (DEPLOY.md §15)."
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Resolver el SHA a revertir
        run: |
          sha_input="${{ github.event.inputs.sha }}"
          if [ -n "$sha_input" ]; then
            resolved="$sha_input"
          else
            resolved="$(ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'cat ~/.ultimo-deploy-ok 2>/dev/null || true')"
            if [ -z "$resolved" ]; then
              echo "::error::No se pasó un SHA (input 'sha') y no existe ~/.ultimo-deploy-ok en el servidor. No hay a qué revertir — pasá el SHA a mano."
              exit 1
            fi
          fi
          echo "ROLLBACK_SHA=$resolved" >> "$GITHUB_ENV"
          echo "Se va a revertir el código del servidor al commit: $resolved"

      - name: Advertencia — este rollback es solo de código
        run: |
          echo "::warning::Este job revierte SOLO el código (git checkout + npm ci + panel + pm2 reload)."
          echo "::warning::NO toca migraciones ni el esquema de la base de datos. Si la falla vino de un cambio de esquema no compatible hacia atrás, este rollback NO alcanza (protocolo expand/contract en DEPLOY.md)."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.ROLLBACK_SHA }}
      # El smoke sale de ESTE workflow (github.sha), no del commit revertido: un SHA viejo puede
      # no tener scripts/ci/smoke.sh o tener uno desactualizado. Va en una carpeta aparte, después
      # del checkout de arriba (que limpia la raíz del workspace).
      - name: Traer el smoke de este workflow (scripts/ci)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
      - name: Build del panel de ese commit (artefacto)
        run: |
          npm ci --prefix web
          npm run build --prefix web
          tar -czf panel.tgz -C web/dist .
          scp -i ~/.ssh/deploy_key panel.tgz "$DEPLOY_USER@$DEPLOY_HOST:panel-rollback.tgz"

      - name: Revertir el código y recargar el proceso
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd $DEPLOY_DIR
            git fetch --all --tags
            git checkout $ROLLBACK_SHA
            npm ci --omit=dev
            rm -rf web/dist.nuevo web/dist.viejo && mkdir -p web/dist.nuevo
            tar -xzf ~/panel-rollback.tgz -C web/dist.nuevo && rm -f ~/panel-rollback.tgz
            if [ -d web/dist ]; then mv web/dist web/dist.viejo; fi
            mv web/dist.nuevo web/dist
            pm2 startOrReload ecosystem.config.cjs --update-env
          "

      - name: Verificar que el proceso responde (/health)
        run: |
          for i in $(seq 1 10); do
            if curl -sf "$BASE_URL/health" > /dev/null; then
              echo "✅ /health respondió OK (intento $i de 10)"
              exit 0
            fi
            echo "intento $i de 10: /health no respondió aún, reintento en 3s…"
            sleep 3
          done
          echo "::error::El proceso no respondió en /health tras el rollback (30s de reintentos)"
          exit 1

      # El mismo smoke que el deploy (scripts/ci/smoke.sh): un rollback que levanta el proceso
      # pero deja la API, la sesión o la base rotas no se marca como bueno.
      - name: Smoke post-rollback (panel + API + sesión + login)
        run: bash .ci-tools/scripts/ci/smoke.sh "$BASE_URL"

      # Solo si /health y el smoke pasaron: el SHA revertido pasa a ser el nuevo "último bueno".
      - name: Marcar el SHA revertido como "último deploy bueno"
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "echo '$ROLLBACK_SHA' > ~/.ultimo-deploy-ok"
          echo "Guardado ~/.ultimo-deploy-ok = $ROLLBACK_SHA"
